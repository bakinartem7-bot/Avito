databaseChangeLog:
  - changeSet:
      id: create-ads-table
      author: student
      changes:
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: numeric(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: now()
              - column:
                  name: updated_at
                  type: timestamp
              - addForeignKeyConstraint:
                  baseTableName: ads
                  baseColumnNames: author_id
                  referencedTableName: users
                  referencedColumnNames: id
                  onDelete: CASCADE
                  onUpdate: CASCADE
