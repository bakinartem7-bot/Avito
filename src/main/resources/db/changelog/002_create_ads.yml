databaseChangeLog:
  - changeSet:
      id: create-ads-table
      author: student
      changes:
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: price
                  type: numeric(10,2)
              - addForeignKeyConstraint:
                  baseTableName: ads
                  baseColumnNames: user_id
                  referencedTableName: users
                  referencedColumnNames: id
