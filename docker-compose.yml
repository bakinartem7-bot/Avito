version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ads-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: strong_password_here
      POSTGRES_DB: ads_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Опционально: если хочешь видеть миграции в логах БД
      # - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d ads_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
